<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Subscriber Dashboard — ByteSize Brain</title>
<style>
:root{color-scheme:dark;--bg:#101018;--panel:#191923;--red:#ff4056;--ink:#f8f7fb;--muted:#b9b7c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:32px 20px}.brand{font-weight:950;letter-spacing:-.04em;font-size:1.4rem}.brand span{color:var(--red)}h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-.05em;margin:32px 0 8px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid #ffffff20;border-radius:16px;padding:22px;margin-top:20px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px;background:#0b0b10;border:1px solid #ffffff40;border-radius:9px;padding:13px;color:white;font:inherit}button{background:var(--red);color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:900;cursor:pointer}button:disabled{opacity:.5}.count{font-size:3.5rem;font-weight:1000;line-height:1.1;color:var(--red)}.status{min-height:1.5em;color:#ffd84d}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #ffffff18;overflow-wrap:anywhere}th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.table-wrap{overflow-x:auto}.hidden{display:none!important}
</style>
</head>
<body><main class="wrap">
<div class="brand">ByteSize <span>Brain</span> / Admin</div>
<h1>Subscriber dashboard</h1>
<p class="muted">Private view of newsletter subscriptions. Keep your dashboard token secret.</p>
<div class="panel" id="login-panel">
  <form id="login-form"><label for="token">Dashboard access token</label><div class="row" style="margin-top:8px"><input id="token" type="password" autocomplete="current-password" required placeholder="Enter your private token"><button type="submit">View subscribers</button></div></form>
  <p class="status" id="login-status" role="status"></p>
</div>
<div id="dashboard" class="hidden">
  <div class="panel"><div class="muted">Total subscribers</div><div class="count" id="count">—</div><p class="muted">Newest 500 addresses are shown below.</p><div class="row"><button id="refresh">Refresh</button><button id="export" type="button">Export CSV</button><button id="logout" type="button">Lock dashboard</button></div><p class="status" id="dashboard-status" role="status"></p></div>
  <div class="panel"><h2>Subscriber emails</h2><div class="table-wrap"><table><thead><tr><th>Email</th><th>Subscribed at</th></tr></thead><tbody id="subscribers"></tbody></table></div></div>
</div>
</main>
<script>
let token = "";
let currentSubscribers = [];
const loginForm = document.getElementById("login-form");
const loginStatus = document.getElementById("login-status");
const dashboardStatus = document.getElementById("dashboard-status");
async function loadSubscribers() {
  dashboardStatus.textContent = "Loading…";
  try {
    const response = await fetch("/api/subscribers", {headers: {Authorization: "Bearer " + token}, cache: "no-store"});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Could not load subscribers.");
    document.getElementById("count").textContent = result.count;
    currentSubscribers = result.subscribers || [];
    const tbody = document.getElementById("subscribers");
    tbody.replaceChildren();
    currentSubscribers.forEach(item => {
      const tr = document.createElement("tr");
      const emailTd = document.createElement("td"); emailTd.textContent = item.email;
      const dateTd = document.createElement("td");
      dateTd.textContent = item.subscribed_at ? new Date(item.subscribed_at).toLocaleString() : "—";
      tr.append(emailTd, dateTd); tbody.appendChild(tr);
    });
    dashboardStatus.textContent = "Updated successfully.";
  } catch (error) {
    dashboardStatus.textContent = error.message;
    if (error.message === "Unauthorized.") lockDashboard();
  }
}
loginForm.addEventListener("submit", async event => {
  event.preventDefault();
  token = document.getElementById("token").value;
  await loadSubscribers();
  if (dashboardStatus.textContent === "Updated successfully.") {
    document.getElementById("login-panel").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
  } else loginStatus.textContent = dashboardStatus.textContent;
});
document.getElementById("refresh").addEventListener("click", loadSubscribers);
document.getElementById("logout").addEventListener("click", lockDashboard);
function lockDashboard() {
  token = ""; currentSubscribers = [];
  document.getElementById("token").value = "";
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login-panel").classList.remove("hidden");
  loginStatus.textContent = "Dashboard locked.";
}
document.getElementById("export").addEventListener("click", () => {
  const rows = [["email","subscribed_at"], ...currentSubscribers.map(s => [s.email, s.subscribed_at || ""])];
  const csv = rows.map(row => row.map(value => '"' + String(value).replaceAll('"','""') + '"').join(",")).join("\\r\\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = "bytesize-brain-subscribers.csv"; a.click(); URL.revokeObjectURL(url);
});
</script></body></html>
